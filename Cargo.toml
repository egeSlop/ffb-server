[package]
name = "ffb-server"
version = "1.0.0"
edition = "2024"
description = "Game-agnostic force-feedback server for wheels: games send telemetry or forces over a local WebSocket, the server drives the wheel through evdev (Linux) or DirectInput 8 (Windows, untested)."
license = "MIT"

[lib]
name = "ffb_server"
path = "src/lib.rs"

[[bin]]
name = "ffb-server"
path = "src/bin/ffb-server.rs"

[dependencies]
anyhow = "1.0.104"
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tungstenite = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

# DirectInput 8 force feedback (src/wheel/windows.rs). Untested on real hardware.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
